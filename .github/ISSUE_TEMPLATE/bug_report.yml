name: 缺陷报告
description: 报告文档、契约或后续 Flutter 应用问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Flutter 应用尚未初始化。请勿把服务端或 Web 问题报告为 App 缺陷。不要提交凭据、用户数据或漏洞细节；安全问题请阅读 SECURITY.md。"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供最小、已脱敏的复现过程，并指出相关文件或功能。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 填写提交号，以及适用的 Flutter/Dart、操作系统和设备版本。
